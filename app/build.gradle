plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pantrypilot.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pantrypilot.app'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Local Java unit tests for ingredient normalization and units.
dependencies { testImplementation "junit:junit:4.13.2" }
